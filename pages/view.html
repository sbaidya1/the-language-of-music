<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play!</title>
  <link href="../css/lyrics1.css" rel="stylesheet" type="text/css" />
  <link href="../css/vid1.css" rel="stylesheet" type="text/css" />
  <link rel="icon" type="image/x-icon" href="../assets/favicon.svg">
  <script src="https://kit.fontawesome.com/0acf43e926.js" crossorigin="anonymous"></script>
  <link href="../css/mobile.css" rel="stylesheet" type="text/css" />
  <link href="../css/vocab.css" rel="stylesheet" type="text/css" />
</head>

<body onload="createEverything()">
  <div class="main"> 
    <!-- <div class="youdidit">
      <img src="../assets/congrats.svg">
    </div> -->
      <div class = "content">
        <div class="headsong"></div>
        <!-- Language picker for the word-translation feature (see js/vocab.js).
             Double-click any word in the lyrics to see its translation. -->
        <div class="lang-picker">
          <label for="srcLang">Song language:</label>
          <select id="srcLang">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh">Chinese</option>
            <option value="en">English</option>
          </select>
          <small>(double-click any word to translate)</small>
        </div>
      </div>
      <div class="vid">
        <div class="vidstuff">
          <div class="icons">
            <i class="fa-solid fa-house fa-lg" onclick="window.location.href='../index.html'" role="button" aria-label="Home"></i>
            <i class="fa-solid fa-gears fa-lg" onclick="openSettings()" role="button" aria-label="Settings"></i>
            <i class="fa-solid fa-square-poll-vertical fa-lg" onClick="parent.open('https://forms.gle/j5di71bPfFHXeCLE8')" role="button" aria-label="Feedback survey"></i>
          </div>
          <div id="playerholder">
            <div class="settings">
              <div class="topstuff">
                <p id="titSet">Settings</p>
                <i class="fa-solid fa-xmark" onclick="closeSettings()" role="button" aria-label="Close settings"></i>
              </div>
              <div class="options">
                <label class="switch">
                  <input id="charCt" type="checkbox" onclick="charCt(this)" checked aria-label="Show character count">
                  <span class="slider"></span>
                </label>
                <p>Show character count</p>
              </div>
              <div class="options">
                <label class="switch">
                  <input id="reqAcc" type="checkbox" checked aria-label="Require accents">
                  <span class="slider"></span>
                </label>
                <p>Require accents</p>
              </div>
              <div class="options">
                <label class="switch">
                  <input id="*rev" type="checkbox" checked aria-label="Enter three asterisks to reveal word">
                  <span class="slider"></span>
                </label>
                <p>Enter *** to reveal word</p>
              </div>
              <p id="only">Only the teacher of this lesson can change the settings.</p>
            </div>
              <iframe id="player"></iframe>
          </div>
        </div>
      </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/main1.js"></script>
  <script type="module" src="../js/fire1.js"></script>
  <script src="../js/confetti.js"></script>
  <script src="../js/vocab.js"></script>

</body>

</html>
